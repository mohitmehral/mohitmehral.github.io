function Hero(){return <header className="hero container" id="top"><div className="meta-row"><span className="tag">v2026.1</span><span>{"\u25c9"} Malmo, Sweden</span><span>// 19+ yrs {"\u00b7"} 2 orgs {"\u00b7"} aws architect {"\u00b7"} advisor {"\u00b7"} builder</span></div><h1 className="h1">{P.pitch} <span className="serif">scale</span>.</h1><p className="sub">{P.blurb}</p><div className="bottom"><div className="identity"><div className="avatar">MM</div><div className="ident"><div className="role">{P.role}</div><div className="loc">currently at Capgemini {"\u00b7"} Ikano Bank</div></div></div><div className="cta-row"><a href="#work" className="btn primary">selected work {"\u2192"}</a><a href={"mailto:"+P.email} className="btn">get in touch</a></div></div></header>}

function Metrics(){return <section><div className="container"><div className="sec-head"><div><div className="num">{"\u00a7"} 00</div><h2>Impact at a glance.</h2></div></div><div className="metrics">{M.map((m,i)=><div className="m" key={i}><div className="v">{m.v}</div><div className="l">{m.l}</div><div className="n">{m.n}</div></div>)}</div><div className="scale-box"><h3 className="scale-title">{SCALE.title}<span className="scale-loc">at Ikano Bank, Sweden</span></h3><div className="scale-stats">{SCALE.items.map((s,i)=><div key={i} className="scale-item"><div className="scale-v">{s.v}</div><div className="scale-l">{s.l}</div></div>)}</div><div className="stack-chips">{SCALE.stacks.map((s,i)=><span key={i} className="stack-chip">{s}</span>)}</div><p className="scale-desc">{SCALE.desc}</p><div className="migration-box"><div className="migration-stats">{SCALE.migration.map((m,i)=><div key={i} className="mig-item"><div className="mig-v">{m.v}</div><div className="mig-l">{m.l}</div></div>)}</div></div><div className="eval-section"><h4 className="eval-subtitle">{EVAL.title}</h4><div className="eval-tools">{EVAL.tools.map((t,i)=><div key={i} className={"eval-tool"+(t.highlight?" has-highlight":"")}><div className="eval-tool-v">{t.v}</div><div className="eval-tool-l">{t.l}</div>{t.highlight&&<div className="eval-tool-hl">{"\u2605"} {t.highlight}</div>}</div>)}</div><p className="scale-desc">{EVAL.desc}</p><div className="training-highlight"><span className="training-v">{EVAL.training.v}</span><span className="training-l">{EVAL.training.l}</span></div></div></div></div></section>}

function Work(){return <section id="work"><div className="container"><div className="sec-head"><div><div className="num">{"\u00a7"} 03</div><h2>Selected work.</h2><div className="sub">Tools I built because they didn{"'"}t exist.</div></div></div><div className="projects">{PR.map((p,i)=><a key={i} className={"p"+(p.big?" big":"")} href={p.url} target="_blank" rel="noopener noreferrer"><span className="tag">{p.tag}</span><h3>{p.name}</h3><div className="desc">{p.desc}</div><div className="chips">{p.chips.map(c=><span key={c} className="chip">{c}</span>)}</div></a>)}</div></div></section>}

function Experience(){return <section id="experience"><div className="container"><div className="sec-head"><div><div className="num">{"\u00a7"} 02</div><h2>Nineteen years, two chapters.</h2></div></div><div className="timeline">{EX.map((e,i)=><div className="row" key={i}><div className="period"><span className="dot"></span>{e.period}<span className="loc">{e.loc}</span></div><div className="body"><h3>{e.co}</h3><div className="rl"><span>{e.role}</span>{e.badge&&<span className="badge">{e.badge}</span>}</div><p className="sum">{e.sum}</p><ul>{e.hl.map(h=><li key={h}>{h}</li>)}</ul>{e.metrics&&<div className="exp-metrics">{e.metrics.map((m,j)=><div key={j} className="exp-m"><span className="exp-m-v">{m.v}</span><span className="exp-m-l">{m.link?<>{m.l.split(m.link.text)[0]}<a href={m.link.url} target="_blank" rel="noopener noreferrer" className="exp-link">{m.link.text}</a>{m.l.split(m.link.text)[1]}</>:m.l}</span></div>)}</div>}</div></div>)}</div></div></section>}

function GenAI(){return <section id="genai"><div className="container"><div className="sec-head"><div><div className="num">{"\u00a7"} 01</div><h2>GenAI in Practice.</h2><div className="sub">Making AI enterprise-ready in regulated environments.</div></div></div><div className="genai-grid">{GENAI.items.map((s,i)=>s.url?<a key={i} href={s.url} target="_blank" rel="noopener noreferrer" className="genai-card clickable"><div className="genai-card-v">{s.v}</div><div className="genai-card-l">{s.l}</div></a>:<div key={i} className="genai-card"><div className="genai-card-v">{s.v}</div><div className="genai-card-l">{s.l}</div></div>)}</div><div className="genai-platforms"><h4>Platforms</h4><div className="tags">{GENAI.platforms.map((p,i)=><span key={i} className="stack-chip">{p}</span>)}</div></div></div></section>}

function Stack(){return <section id="stack"><div className="container"><div className="sec-head"><div><div className="num">{"\u00a7"} 04</div><h2>What I work with.</h2></div></div><div className="stack">{ST.map(s=><div className="g" key={s.g}><h4>{s.g}</h4><div className="tags">{s.t.map(t=><span key={t} className="t">{t}</span>)}</div></div>)}</div><div className="cert-full"><h4>Certifications</h4><div className="tags">{CE.map(c=><span key={c} className="t">{c}</span>)}</div></div></div></section>}

function Contact(){return <section id="contact" className="contact"><div className="container"><div className="grid"><h2 className="big">Need a DevSecOps architect who ships? <em>Let{"'"}s talk.</em></h2><div className="list"><div className="r"><span className="k">email</span><span className="v"><a href={"mailto:"+P.email}>{P.email}</a></span></div><div className="r"><span className="k">linkedin</span><span className="v"><a href={"https://"+P.links.li}>{P.links.li}</a></span></div><div className="r"><span className="k">github</span><span className="v"><a href={"https://"+P.links.gh}>{P.links.gh}</a></span></div><div className="r"><span className="k">org</span><span className="v"><a href={"https://"+P.links.cp}>{P.links.cp}</a></span></div><div className="r"><span className="k">education</span><span className="v">{ED.join(" \u00b7 ")}</span></div></div></div><div className="foot"><span>{"\u00a9"} 2025 Mohit Mehral {"\u00b7"} built in malm{"\u00f6"}</span><span>deployed via github pages</span></div></div></section>}

function App(){return <><Nav/><Hero/><Metrics/><GenAI/><Experience/><Work/><Stack/><Contact/></>}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
